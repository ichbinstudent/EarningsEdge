# Forward-factor limit ladder: patient entry into forward-vol underpricing.
# Entry is worked 14:00-15:45 ET by the LadderRunner; exits are managed by the
# framework ExitManager (scheduled close on the near-leg expiry day, PT/SL auto).
[strategy]
name = "ff_ladder"
enabled = true
schedule = "45 13 * * mon-fri"   # 13:45 ET proposals
execution_mode = "approval"
engine = "limit_ladder"      # arming is the human approval
lifecycle = "paper"

[universe]
type = "earnings_calendar"

[risk.sizer]
name = "fixed_dollar"
budget = 2000.0
max_pct_of_equity = 0.05

[risk.limits]
max_pct_per_trade = 0.05
max_pct_per_underlying = 0.15
max_pct_per_strategy_day = 0.20

# Held until the near leg expires: no event-day time rule.
#
# ScheduledExit closes on the near-leg expiry day, 90 min before the close
# (exit_by = near expiry, set at booking). Fills booked with exit_by=None
# never closed — 2026-09 COST was assigned — so the ExitManager backfills
# it for open ff_ladder groups.
[[exits]]
rule = "scheduled"
minutes_before_close = 90

[[exits]]
rule = "profit_target"
pct = 0.50

[[exits]]
rule = "stop_loss"
pct = 0.75

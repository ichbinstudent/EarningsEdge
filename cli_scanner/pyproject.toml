[project]
name = "earnings-edge"
version = "0.3.0"
description = "Scanner for high-probability earnings-based options trades"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "beautifulsoup4>=4.13",
    "curl_cffi>=0.10",
    "exchange-calendars>=4.5",
    "lse-data[frames]>=0.14",
    "numpy>=2.2",
    "pandas>=2.2",
    "plotly>=6.8.0",
    "python-dotenv>=1.0",
    "python-telegram-bot>=20.0",
    "pytz>=2024.1",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.15",
    "selenium>=4.15",
    "sqlalchemy>=2.0",
    "streamlit>=1.58.0",
    "tqdm>=4.66",
    "webdriver-manager>=4.0",
    "websocket-client>=1.7",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dolthub = ["mysql-connector-python>=8.2"]
yahooquery = ["yahooquery>=2.4"]
ib = ["ib_insync>=0.9.86"]

[project.scripts]
earnings-edge = "scanner:main"
trading-bot = "bot:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Default run includes unit + integration + e2e (all fast, no network).
# Narrow with:  -m integration | -m e2e | -m "not integration and not e2e"
# (see tests/README.md)
markers = [
    "integration: component interactions on a temp DB with mocked providers (no network)",
    "e2e: full collect->scan->propose pipeline on fixture data into a temp DB",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earnings_edge*", "framework*"]


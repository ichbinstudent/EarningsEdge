name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync --group dev

      - name: Run test suite
        run: uv run python -m pytest tests -q --tb=short

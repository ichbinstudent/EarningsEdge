[project]
name = "earnings-edge"
version = "0.3.0"
description = "Scanner for high-probability earnings-based options trades"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "beautifulsoup4>=4.13",
    "curl_cffi>=0.10",
    "exchange-calendars>=4.5",
    "lse-data[frames]>=0.14",
    "numpy>=2.2",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "python-telegram-bot>=20.0",
    "pytz>=2024.1",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.15",
    "selenium>=4.15",
    "sqlalchemy>=2.0",
    "starlette>=0.40",
    "tqdm>=4.66",
    "uvicorn>=0.30",
    "webdriver-manager>=4.0",
    "websocket-client>=1.7",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dolthub = ["mysql-connector-python>=8.2"]
yahooquery = ["yahooquery>=2.4"]
ib = ["ib_insync>=0.9.86"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
    "ty>=0.0.78",
    "ruff>=0.16.6",
]

# ── ty (Astral) — type gate, replaces mypy ────────────────────────────────
# Scoped like the old mypy gate: strict islands on the DB row-shape layer
# (the 2026-09-04 wrong-key incident class); base rules lenient elsewhere.
# ty checks unannotated bodies by default, so no check_untyped_defs.
[tool.ty.src]
include = ["earnings_edge", "framework", "dashboard", "bot.py"]

[tool.ty.terminal]
# Warnings (pandas Series-vs-Sequence etc.) don't block CI; errors do.
# Strict islands raise their rules to error, so the gate stays real.
error-on-warning = false

[tool.ty.rules]
# Soundness defaults for everything in scope. Strict islands below raise these to error.
unresolved-attribute = "warn"      # mostly pandas/dynamic attr access — noisy, not blocking
invalid-argument-type = "warn"     # lots of pandas Series-vs-Sequence — real signal, not blocking yet
invalid-return-type = "warn"
invalid-assignment = "warn"
unresolved-import = "error"        # missing imports block (caught the FF-ladder NameError class)

[[tool.ty.overrides]]
include = ["earnings_edge/db/**", "earnings_edge/rich_msg.py", "earnings_edge/bot_views.py"]
[tool.ty.overrides.rules]
all = "error"
# bare list/dict generics are pervasive in the pre-existing code; parameterize
# incrementally rather than blocking CI on 80 sites at once.
missing-type-argument = "ignore"
# SQLAlchemy 2.0 Mapped[...] columns are Any-typed without sqlalchemy-stubs;
# unsound-assignment on models.py is a stubs gap, not a code bug.
unsound-assignment = "ignore"
unsound-return-statement = "warn"
disjoint-cast = "warn"

[[tool.ty.overrides]]
include = ["tests/**", "scripts/**"]
[tool.ty.overrides.rules]
all = "ignore"

# ── ruff — lint + format ────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "data", "docs", "scripts/archive"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes — real bugs (unused imports, undefined names)
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "DTZ",         # datetime traps — trading system, tz bugs hurt
    "RUF",         # ruff-specific
]
ignore = [
    "E501",     # line length enforced by ruff format at 110, not lint
    # Style-tier rules with existing findings: parked in the backlog
    # (docs/architecture_improvements.md), ignored until triaged per-site.
    "DTZ007",   # strptime without tz: parses local-date strings deliberately
    "DTZ002",   # datetime.today(): local-date convention
    "DTZ006",   # fromtimestamp: called on epoch secs where tz is irrelevant
    "SIM105",   # suppressible-exception: contextlib rewrite needed per site
    "SIM117",   # nested with-statements: readability preference
    "SIM108",   # ternary rewrite: readability preference in long branches
    "SIM103",   # needless-bool: style
    "B007",     # unused loop var (renames churn tests)
    "B905",     # zip strict= (semantics change; needs per-site review)
    "B028",     # stacklevel (log noise, not a bug)
    "RUF046",   # unnecessary-cast (style)
    "RUF013",   # implicit-optional (pre-existing signatures; ty TypedDicts govern)
    "RUF015",   # iterable-allocation style
    "F841",     # unused locals: needs per-site review (some are API leftovers)
    "RUF059",   # unused unpacked vars: needs per-site review
    "S110",     # try-except-pass: panel/cosmetic paths; trading paths governed by exc-policy lint
    "BLE001",   # blind-except: governed by tests/test_exc_policy.py
    "G201",     # logging-exc-info: style, not a bug (removed G entirely; keeping lint fast)
    "DTZ011",   # date.today(): consistently local-date in this repo
    "UP035",    # deprecated-import churn; covered by UP006/UP045
    "E402",     # imports after code: deliberate pattern in bot.py (dotenv before imports)
    "E741",     # ambiguous names l/1: readability only
    "G",        # logging rules off — 34 G004 style hits, zero bugs
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode in strings/comments: emoji-heavy Telegram strings
    "RUF005",   # list concat style
    "RUF012",   # mutable class defaults: framework uses them deliberately
    "B008",     # call-in-default: used for db engine handles
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ", "E702", "RUF059", "SIM102", "SIM110"]
"framework/ops.py" = ["SIM115"]  # InstanceLock holds its fd for process lifetime by design
"scripts/*" = ["DTZ", "E402"]  # E402: sys.path bootstrap before imports is the scripts convention

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
# Default run includes unit + integration + e2e (all fast, no network).
# Narrow with:  -m integration | -m e2e | -m "not integration and not e2e"
# (see tests/README.md)
markers = [
    "integration: component interactions on a temp DB with mocked providers (no network)",
    "e2e: full collect->scan->propose pipeline on fixture data into a temp DB",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earnings_edge*", "framework*"]

